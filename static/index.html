<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebinarIQ · Webinar Intelligence</title>

  <!-- Trilliant typography stack: Inter UI, Fraunces display, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

  <!-- Preload critical assets so they start downloading immediately -->
  <link rel="preload" href="/static/styles.css?v=104" as="style" />
  <link rel="preload" href="/static/trilliant.css?v=104" as="style" />
  <link rel="preload" href="/static/app.js?v=104" as="script" />
  <link rel="stylesheet" href="/static/styles.css?v=104" />
  <link rel="stylesheet" href="/static/trilliant.css?v=104" />
  <!-- Inline loader: visible instantly, removed by JS once data loads -->
  <style>
    #page-loader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .35s ease}
    html.dark #page-loader{background:#0F172A}
    #page-loader.fade{opacity:0;pointer-events:none}
    .pl-ring{width:44px;height:44px;border:3px solid rgba(124,58,237,.15);border-top-color:#7C3AED;border-radius:50%;animation:plspin .75s linear infinite}
    .pl-label{color:#9CA3AF;font-size:12px;font-family:'Inter',system-ui,sans-serif;margin-top:14px;letter-spacing:.05em;font-weight:500}
    @keyframes plspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- Instant loading splash - removed by JS once data arrives -->
<div id="page-loader">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="pl-ring"></div>
    <span class="pl-label">WebinarIQ</span>
  </div>
</div>

<!-- Cursor glow that follows the mouse -->
<div id="cursor-glow"></div>

<!-- Floating ambient blobs -->
<div class="blob-bg" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- ── HORIZONTAL NAVBAR ──────────────────────────────────── -->
<header class="navbar" id="navbar">
  <div class="nav-container">

    <!-- Brand -->
    <div class="nav-brand" onclick="nav('home')">
      <div class="nav-logo-mark">
        <!-- Custom W + intelligence-dot logomark -->
        <svg width="22" height="20" viewBox="0 0 24 22" fill="none">
          <polyline points="2,6 6.5,19 12,11.5 17.5,19 22,6"
                    stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="3.2" r="2.1" fill="white"/>
        </svg>
      </div>
      <span class="nav-brand-name">Webinar<em class="brand-iq">IQ</em></span>
    </div>

    <!-- Desktop nav links -->
    <nav class="nav-links" id="nav-links">
      <button class="nav-link active" data-page="home" onclick="nav('home')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-link" data-page="analytics" onclick="nav('analytics')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        Analytics
      </button>
      <button class="nav-link" data-page="speakers" onclick="nav('speakers')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Speakers
      </button>
      <button class="nav-link" data-page="leaderboard" onclick="nav('leaderboard')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Leaderboard
      </button>
      <button class="nav-link" data-page="topics" onclick="nav('topics')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
        Topics
      </button>
      <button class="nav-link" data-page="intelligence" onclick="nav('intelligence')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Intelligence
      </button>
    </nav>

    <!-- Right-side controls -->
    <div class="nav-right">

      <!-- Dashboard filter chips -->
      <div class="nav-chips" id="nav-chips" style="display:none">
        <button class="tb-chip active" data-filter="all"       onclick="setChipFilter('all')">All</button>
        <button class="tb-chip"        data-filter="completed" onclick="setChipFilter('completed')">Completed</button>
        <button class="tb-chip"        data-filter="upcoming"  onclick="setChipFilter('upcoming')">Upcoming</button>
        <button class="tb-chip"        data-filter="range"     onclick="openDateRangePopover(this)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="date-range-label">Date Range</span>
        </button>
      </div>

      <!-- Date range popover -->
      <div class="date-range-popover" id="date-range-popover" style="display:none">
        <div class="drp-header">Filter by Date Range</div>
        <div class="drp-quick">
          <button onclick="applyQuickRange(7)">Last 7 days</button>
          <button onclick="applyQuickRange(30)">Last 30 days</button>
          <button onclick="applyQuickRange(90)">Last 90 days</button>
          <button onclick="applyQuickRange('thisMonth')">This Month</button>
          <button onclick="applyQuickRange('thisYear')">This Year</button>
        </div>
        <div class="drp-fields">
          <label>
            <span>From</span>
            <input type="date" id="drp-from" />
          </label>
          <label>
            <span>To</span>
            <input type="date" id="drp-to" />
          </label>
        </div>
        <div class="drp-actions">
          <button class="drp-clear" onclick="clearDateRange()">Clear</button>
          <button class="drp-apply" onclick="applyDateRange()">Apply</button>
        </div>
      </div>

      <!-- Notifications -->
      <button class="tb-notif-btn" id="tb-notif-btn" onclick="toggleNotifPanel()" title="Activity feed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
      </button>

      <!-- Theme toggle -->
      <button class="nav-theme-btn" onclick="toggleDark()" title="Toggle theme">
        <svg id="dark-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- New Webinar CTA -->
      <button class="btn btn-primary btn-sm" onclick="openWebinarModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Webinar
      </button>

      <!-- Mobile hamburger -->
      <button class="nav-hamburger" id="nav-hamburger" onclick="toggleMobileNav()" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown menu -->
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <button class="nav-link" data-page="home"        onclick="nav('home');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </button>
    <button class="nav-link" data-page="analytics"   onclick="nav('analytics');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      Analytics
    </button>
    <button class="nav-link" data-page="speakers"    onclick="nav('speakers');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Speakers
    </button>
    <button class="nav-link" data-page="leaderboard" onclick="nav('leaderboard');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      Leaderboard
    </button>
    <button class="nav-link" data-page="topics" onclick="nav('topics');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
      Topics
    </button>
    <button class="nav-link" data-page="intelligence" onclick="nav('intelligence');toggleMobileNav()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>
      Intelligence
    </button>
    <div style="padding-top:8px;border-top:1px solid rgba(102,126,234,0.12);margin-top:4px">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="openWebinarModal();toggleMobileNav()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Webinar
      </button>
    </div>
  </div>
</header>

<!-- ── MAIN CONTENT ───────────────────────────────────────── -->
<main class="site-main">
  <div class="site-container" id="content">
    <div class="pg-loading">
      <div class="spinner"></div>
      <p>Loading your dashboard…</p>
    </div>
  </div>
</main>

<!-- Notification Panel -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-head">
    <span class="notif-head-title">Activity Feed</span>
    <button class="notif-mark-all" onclick="markAllRead()">Mark all read</button>
  </div>
  <div class="notif-list" id="notif-list">
    <div class="notif-empty">No recent activity</div>
  </div>
</div>
<div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifPanel()"></div>

<!-- ── COMMAND PALETTE ─────────────────────────────────────── -->
<div class="cmd-overlay" id="cmd-overlay" onclick="closeCmdPalette()">
  <div class="cmd-box" onclick="event.stopPropagation()">
    <div class="cmd-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="cmd-input" class="cmd-input" placeholder="Search webinars, speakers, actions…" oninput="onCmdSearch(this.value)" autocomplete="off" />
      <button class="cmd-esc" onclick="closeCmdPalette()">ESC</button>
    </div>
    <div class="cmd-results" id="cmd-results"></div>
    <div class="cmd-footer">
      <span><kbd>↑↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>ESC</kbd> close</span>
    </div>
  </div>
</div>

<!-- ── NEW WEBINAR MODAL ──────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeWebinarModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <h3 class="modal-title">Add New Webinar</h3>
        <p class="modal-sub">Fill in the details to create a new webinar session</p>
      </div>
      <button class="modal-close" onclick="closeWebinarModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label class="form-label">Webinar Name <span class="req">*</span></label>
        <input class="form-input" id="nw-title" type="text" placeholder="e.g. Personal Finance Masterclass" />
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Date <span class="req">*</span></label>
          <input class="form-input" id="nw-date" type="date" />
        </div>
        <div class="form-field">
          <label class="form-label">Time <span class="opt">(optional)</span></label>
          <input class="form-input" id="nw-time" type="text" placeholder="e.g. 10:00 AM" />
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Speaker Name <span class="req">*</span></label>
        <input class="form-input" id="nw-speaker" type="text" placeholder="e.g. Anil Rego" list="speaker-list" />
        <datalist id="speaker-list"></datalist>
      </div>
      <div class="form-field">
        <label class="form-label">ICP (Ideal Customer Profile)</label>
        <select class="form-input" id="nw-icp">
          <option value="Others">Others</option>
          <option value="PMS">PMS</option>
          <option value="Retirement Planning">Retirement Planning</option>
          <option value="NRI">NRI</option>
          <option value="ESOPs">ESOPs</option>
          <option value="Family Office">Family Office</option>
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Status</label>
        <div class="status-pills" id="nw-status-pills">
          <label class="status-pill">
            <input type="radio" name="nw-status-radio" value="upcoming" checked />
            <div class="sp-content">
              <span class="sp-label">📅 Upcoming</span>
              <span class="sp-desc">Scheduled webinar</span>
            </div>
          </label>
          <label class="status-pill">
            <input type="radio" name="nw-status-radio" value="completed" />
            <div class="sp-content">
              <span class="sp-label">✅ Completed</span>
              <span class="sp-desc">Session finished</span>
            </div>
          </label>
          <label class="status-pill">
            <input type="radio" name="nw-status-radio" value="cancelled" />
            <div class="sp-content">
              <span class="sp-label">❌ Cancelled</span>
              <span class="sp-desc">No longer happening</span>
            </div>
          </label>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Description <span class="opt">(optional)</span></label>
        <textarea class="form-textarea" id="nw-desc" placeholder="Brief description of this webinar…" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeWebinarModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitWebinarModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Webinar
      </button>
    </div>
  </div>
</div>

<!-- ── ATTENDEE PROFILE DRAWER ────────────────────────────── -->
<div class="att-overlay" id="att-overlay" onclick="closeAttendeeModal()">
  <div class="att-drawer" id="att-drawer" onclick="event.stopPropagation()">
    <div class="att-drawer-head">
      <div class="att-drawer-person">
        <div class="att-drawer-av" id="att-av"></div>
        <div>
          <div class="att-drawer-name" id="att-name"></div>
          <div class="att-drawer-meta" id="att-meta"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeAttendeeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="att-drawer-stats" id="att-stats"></div>
    <div class="att-drawer-body" id="att-body">
      <div class="pg-loading"><div class="spinner"></div><p>Loading…</p></div>
    </div>
  </div>
</div>

<!-- ── AD CREATIVE MODAL ──────────────────────────────────── -->
<div class="modal-overlay" id="ad-modal-overlay" onclick="closeAdModal()">
  <div class="modal-box modal-box-wide" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <h3 class="modal-title">Add Ad Creative</h3>
        <p class="modal-sub">Attach advertising data to this webinar</p>
      </div>
      <button class="modal-close" onclick="closeAdModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" style="max-height:68vh;overflow-y:auto">
      <div class="form-row">
        <div class="form-field" style="flex:2">
          <label class="form-label">Ad Title <span class="req">*</span></label>
          <input class="form-input" id="ad-title" type="text" placeholder="e.g. Finance Masterclass Banner" />
        </div>
        <div class="form-field">
          <label class="form-label">Platform</label>
          <select class="form-input" id="ad-platform">
            <option value="">Select…</option>
            <option value="Facebook">Facebook</option>
            <option value="Instagram">Instagram</option>
            <option value="Google">Google Ads</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="YouTube">YouTube</option>
            <option value="Twitter">Twitter / X</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">Ad Type</label>
          <select class="form-input" id="ad-type">
            <option value="">Select…</option>
            <option value="Image">Image</option>
            <option value="Video">Video</option>
            <option value="Carousel">Carousel</option>
            <option value="Story">Story</option>
            <option value="Reel">Reel</option>
            <option value="Banner">Banner</option>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Creative Image <span class="opt">(optional)</span></label>
        <div class="ad-creative-upload" id="ad-creative-dropzone"
             ondragover="event.preventDefault();this.classList.add('dragover')"
             ondragleave="this.classList.remove('dragover')"
             ondrop="handleAdImageDrop(event)">
          <div class="ad-creative-placeholder" id="ad-creative-placeholder">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Drop image here or</span>
            <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('ad-image-input').click()">Browse</button>
          </div>
          <img id="ad-creative-preview" class="ad-creative-preview" style="display:none" alt="Creative preview" />
          <button type="button" id="ad-creative-clear" class="ad-creative-clear" style="display:none" onclick="clearAdImage()">✕ Remove</button>
        </div>
        <input type="file" id="ad-image-input" accept="image/*" style="display:none" onchange="handleAdImageSelect(event)" />
        <input class="form-input" id="ad-creative-url" type="url" placeholder="Or enter image URL…" style="margin-top:8px" />
      </div>
      <div class="form-row">
        <div class="form-field" style="flex:2">
          <label class="form-label">Headline</label>
          <input class="form-input" id="ad-headline" type="text" placeholder="e.g. Join Our Free Webinar!" />
        </div>
        <div class="form-field">
          <label class="form-label">CTA Text</label>
          <input class="form-input" id="ad-cta" type="text" placeholder="e.g. Register Now" />
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Ad Description</label>
        <textarea class="form-textarea" id="ad-description" placeholder="Ad copy / description…" rows="2"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label">Landing Page URL</label>
        <input class="form-input" id="ad-landing-url" type="url" placeholder="https://…" />
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Budget</label>
          <input class="form-input" id="ad-budget" type="text" placeholder="e.g. ₹5,000" />
        </div>
        <div class="form-field">
          <label class="form-label">Actual Spend</label>
          <input class="form-input" id="ad-spend" type="text" placeholder="e.g. ₹3,200" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Impressions</label>
          <input class="form-input" id="ad-impressions" type="number" placeholder="0" min="0" />
        </div>
        <div class="form-field">
          <label class="form-label">Clicks</label>
          <input class="form-input" id="ad-clicks" type="number" placeholder="0" min="0" />
        </div>
        <div class="form-field">
          <label class="form-label">Conversions</label>
          <input class="form-input" id="ad-conversions" type="number" placeholder="0" min="0" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Start Date</label>
          <input class="form-input" id="ad-start-date" type="date" />
        </div>
        <div class="form-field">
          <label class="form-label">End Date</label>
          <input class="form-input" id="ad-end-date" type="date" />
        </div>
        <div class="form-field">
          <label class="form-label">Status</label>
          <select class="form-input" id="ad-status">
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label">Notes <span class="opt">(optional)</span></label>
        <textarea class="form-textarea" id="ad-notes" placeholder="Any additional notes about this ad…" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeAdModal()">Cancel</button>
      <button class="btn btn-primary" id="ad-submit-btn" onclick="submitAdModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Save Ad
      </button>
    </div>
  </div>
</div>

<!-- ── TOAST ──────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script src="/static/app.js?v=104"></script>
</body>
</html>
